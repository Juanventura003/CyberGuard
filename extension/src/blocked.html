<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Website blocked · CyberGuard</title>
		<link rel="stylesheet" href="blocked.css" />
	</head>
	<body>
		<main>
			<span class="brand">CYBERGUARD · TEAM PROTECTION</span>
			<h1>This website is blocked.</h1>
			<p>Your organization has a website rule that prevented this visit.</p>
			<strong id="domain"></strong>
			<p id="organization" role="status">Managed by your organization</p>
			<p id="sharing">This visit is not reported to your organization.</p>
			<p>Need this website? Ask your admin to review the rule.</p>
			<a
				id="request-review"
				href="http://localhost:5173/organization"
				target="_blank"
				rel="noopener noreferrer"
				hidden
				>Request a website review</a
			><a
				id="dashboard"
				href="http://localhost:5173/organization"
				target="_blank"
				rel="noopener noreferrer"
				>Open CyberGuard</a
			>
		</main>
		<script src="blocked.js"></script>
	</body>
</html>
